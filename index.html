<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      The hero's first frame, fetched while the HTML is still parsing.

      This app renders on the client, so the <video> and its poster are not
      discoverable until the bundle has downloaded, parsed and rendered — the
      preload scanner never sees them. A 36KB hint here means the first screen
      has a photograph on it at about the moment React mounts rather than a
      second later.
    -->
    <link rel="preload" as="image" href="/video/hero-kitchen.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SNS — Restaurant Onboarding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
